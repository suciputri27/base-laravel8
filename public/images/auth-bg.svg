  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="320" cy="240" r="430" fill="url(#glow1)" filter="url(#blur)"/>
  <circle cx="1600" cy="860" r="520" fill="url(#glow2)" filter="url(#blur)"/>
  <circle cx="1240" cy="160" r="320" fill="url(#glow3)" filter="url(#blur)"/>
